services:
  server:
    image: caddy:2.11-alpine
    container_name: server
    restart: always
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data        # certs live here
      - caddy_config:/config
    networks:
      - heartbit
      - caddy_shared

  my_app:
    image: my_app:latest
    container_name: my_app
    restart: on-failure
    build:
      context: ./src
      dockerfile: docker/Dockerfile
    env_file:
      - ./src/.env
    ports:
      - "20000:20000"
    depends_on:
      - server
    networks:
      - heartbit
    volumes:
      - data:/data

volumes:
  data:
  caddy_data:
  caddy_config:

networks:
  caddy_shared:
    external: true
  heartbit:
